# UA Shiny apps reverse proxy rules (Apache)
# Place in /etc/httpd/conf.d/ua-shiny.conf or include in your SSL vhost.

ProxyPreserveHost On
RequestHeader set X-Forwarded-Proto "https" env=HTTPS

RedirectMatch 302 ^/ua/training$ /ua/training/
RedirectMatch 302 ^/ua/staffing$ /ua/staffing/
RedirectMatch 302 ^/ua/staffing-fixed$ /ua/staffing-fixed/
RedirectMatch 302 ^/ua/job-crafting$ /ua/job-crafting/
RedirectMatch 302 ^/ua/fisher-2017$ /ua/fisher-2017/
RedirectMatch 302 ^/ua/fisher-2020$ /ua/fisher-2020/
RedirectMatch 302 ^/ua/sturman$ /ua/sturman/

ProxyPass        /ua/training/websocket/      ws://127.0.0.1:3841/websocket/
ProxyPassReverse /ua/training/websocket/      ws://127.0.0.1:3841/websocket/
ProxyPass        /ua/training/                http://127.0.0.1:3841/
ProxyPassReverse /ua/training/                http://127.0.0.1:3841/

ProxyPass        /ua/staffing/websocket/      ws://127.0.0.1:3842/websocket/
ProxyPassReverse /ua/staffing/websocket/      ws://127.0.0.1:3842/websocket/
ProxyPass        /ua/staffing/                http://127.0.0.1:3842/
ProxyPassReverse /ua/staffing/                http://127.0.0.1:3842/

ProxyPass        /ua/staffing-fixed/websocket/ ws://127.0.0.1:3843/websocket/
ProxyPassReverse /ua/staffing-fixed/websocket/ ws://127.0.0.1:3843/websocket/
ProxyPass        /ua/staffing-fixed/          http://127.0.0.1:3843/
ProxyPassReverse /ua/staffing-fixed/          http://127.0.0.1:3843/

ProxyPass        /ua/job-crafting/websocket/  ws://127.0.0.1:3844/websocket/
ProxyPassReverse /ua/job-crafting/websocket/  ws://127.0.0.1:3844/websocket/
ProxyPass        /ua/job-crafting/            http://127.0.0.1:3844/
ProxyPassReverse /ua/job-crafting/            http://127.0.0.1:3844/

ProxyPass        /ua/fisher-2017/websocket/   ws://127.0.0.1:3845/websocket/
ProxyPassReverse /ua/fisher-2017/websocket/   ws://127.0.0.1:3845/websocket/
ProxyPass        /ua/fisher-2017/             http://127.0.0.1:3845/
ProxyPassReverse /ua/fisher-2017/             http://127.0.0.1:3845/

ProxyPass        /ua/fisher-2020/websocket/   ws://127.0.0.1:3846/websocket/
ProxyPassReverse /ua/fisher-2020/websocket/   ws://127.0.0.1:3846/websocket/
ProxyPass        /ua/fisher-2020/             http://127.0.0.1:3846/
ProxyPassReverse /ua/fisher-2020/             http://127.0.0.1:3846/

ProxyPass        /ua/sturman/websocket/       ws://127.0.0.1:3847/websocket/
ProxyPassReverse /ua/sturman/websocket/       ws://127.0.0.1:3847/websocket/
ProxyPass        /ua/sturman/                 http://127.0.0.1:3847/
ProxyPassReverse /ua/sturman/                 http://127.0.0.1:3847/
